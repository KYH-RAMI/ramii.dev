name: Build, test and publish

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.100'

      - name: Restore NuGet packages
        run: dotnet restore ramii.dev.slnx

      - name: Build solution
        run: dotnet build ramii.dev.slnx --configuration Release --no-restore

      - name: Run Backstage authorization tests
        run: dotnet run --project ramii.dev.Backstage.Tests --configuration Release --no-build

  publish-image:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker build \
            -f ramii.dev/Dockerfile \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$GITHUB_SHA" .

          docker push "$IMAGE:$GITHUB_SHA"