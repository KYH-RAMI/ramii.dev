services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${RAMII_SQL_PASSWORD:?Set RAMII_SQL_PASSWORD}"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - 'SQLCMDPASSWORD="$$MSSQL_SA_PASSWORD" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q "SELECT 1"'
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  web:
    build:
      context: .
      dockerfile: ramii.dev/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=RamiiDevDb;User ID=sa;Password=${RAMII_SQL_PASSWORD:?Set RAMII_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    ports:
      - "127.0.0.1:${RAMII_WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  sql-data:
